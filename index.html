<script>
// Each project is one record. Adding work = adding a record; the layout never changes.
// "no" is a permanent ID (order started). The array order is the display order.
var projects = [
  { no: "03", title: "SHED", tags: "Space · Hardware · Build", status: "complete", img: "shed-dwg-site.jpg", href: "./work/shed/index.html" },
  { no: "12", title: "Lens Mod", tags: "Hardware · Drawing · Optics", status: "wip", img: "lens-mounted.jpg", href: "./work/lens-mod/index.html" },
  { no: "11", title: "Yamaha SR500", tags: "Mechanical · Repair", status: "ongoing", img: "sr-cover.jpg", href: "./work/sr500/index.html" },
  { no: "02", title: "Chair Study", tags: "Metal · Build", status: "complete", img: "chair.jpg", href: "./work/chair/index.html" },
  { no: "06", title: "Ceramics / Grasshopper", tags: "Material · Computation", status: "complete", img: "cer-gh-grid.jpg", href: "./work/ceramics/index.html" },
  { no: "13", title: "Print to Slip Cast", tags: "Material · Fabrication", status: "complete", img: "slip-cover.jpg", href: "./work/slip-cast/index.html" },
  { no: "08", title: "Light Meter", tags: "Hardware · Electronics", status: "complete", img: "lm-cover.jpg", href: "./work/light-meter/index.html" },
  { no: "14", title: "Self-Watering System", tags: "Hardware · Electronics", status: "complete", img: "sw-sensor.jpg", href: "./work/self-watering/index.html" },
  { no: "15", title: "Grid Lamp", tags: "Lighting · Drawing", status: "complete", img: "lamp-cover.jpg", href: "./work/lamp/index.html" },
  { no: "09", title: "Watch", tags: "Hardware · Drawing", status: "wip", img: "f91w-cover.jpg", href: "./work/f91w/index.html" },
];
var label = { wip: "In progress", ongoing: "Ongoing" };
var loop = document.getElementById("loop");
var prev = document.getElementById("preview"), cap = document.getElementById("preview-cap");

var plink = document.getElementById("preview-link");
function show(p, row) {
  document.querySelectorAll(".idx-row.on").forEach(function (r) { r.classList.remove("on"); });
  if (row) document.querySelectorAll('.idx-row[data-no="' + p.no + '"]').forEach(function (r) { r.classList.add("on"); });
  prev.hidden = !p.img;
  if (p.img) { prev.src = "./img/" + p.img; prev.alt = p.title; }
  if (p.href) plink.href = p.href; else plink.removeAttribute("href");
  cap.textContent = p.title + (p.img ? "" : " · no images yet");
}
// When nobody is hovering, the preview cycles through project images every 10 seconds.
var hovering = false, mx = -1, my = -1;
// Track the pointer so scrolling under a still cursor updates the highlight row by row.
loop.addEventListener("mousemove", function (e) { mx = e.clientX; my = e.clientY; hovering = true; pick(); });
loop.addEventListener("mouseleave", function () { hovering = false; mx = my = -1; });
loop.addEventListener("scroll", function () { if (hovering) requestAnimationFrame(pick); });
var lastRow = null;
function pick() {
  if (mx < 0) return;
  var el = document.elementFromPoint(mx, my), row = el && el.closest(".idx-row");
  if (!row || row === lastRow) return;
  lastRow = row;
  show(projects.filter(function (q) { return q.no === row.dataset.no; })[0], row);
}
var withImg = projects.filter(function (p) { return p.img; }), ci = 0;
setInterval(function () {
  if (hovering || withImg.length < 2) return;
  ci = (ci + 1) % withImg.length;
  prev.style.opacity = 0;
  setTimeout(function () { show(withImg[ci], null); prev.style.opacity = 1; }, 600);
}, 10000);

// Three identical copies of the list. Scrolling stays in the middle copy;
// when it drifts into the first or last copy it jumps by one copy's height, which looks seamless.
function buildList(copy) {
  var ol = document.createElement("ol"); ol.className = "idx";
  if (copy !== 1) ol.setAttribute("aria-hidden", "true");
  projects.forEach(function (p) {
    var li = document.createElement("li");
    var row = document.createElement(p.href ? "a" : "div");
    if (p.href) row.href = p.href;
    if (copy === 1) { if (!p.href) row.tabIndex = 0; } else { row.tabIndex = -1; }
    row.dataset.no = p.no;
    row.className = "idx-row";
    var pill = "";
    row.innerHTML = '<span class="idx-no">//</span><span class="idx-title">' + p.title + pill +
      '</span><span class="idx-tags">' + p.tags + "</span>";
    row.addEventListener("focus", function () { show(p, row); });
    li.appendChild(row); ol.appendChild(li);
  });
  return ol;
}
[0, 1, 2].forEach(function (c) { loop.appendChild(buildList(c)); });

function setH() { return loop.children[1].offsetHeight; }
function wrap() {
  var h = setH();
  if (loop.scrollTop < h * 0.5) loop.scrollTop += h;
  else if (loop.scrollTop > h * 1.5) loop.scrollTop -= h;
}
loop.addEventListener("scroll", wrap);
window.addEventListener("resize", wrap);
requestAnimationFrame(function () {
  loop.scrollTop = setH();
  show(projects[0], loop.children[1].querySelector(".idx-row"));
});
</script>
